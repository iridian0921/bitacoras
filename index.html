<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23484b">
<title>Bitácoras de inspección</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="comun.css">
<style>
.apps{display:grid;gap:12px;margin-top:14px}
.app{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.app .ic{font-size:34px;width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex:0 0 auto}
.app h3{margin:0;font:700 22px/1.1 var(--fc)}
.app .muted{margin-top:3px}
.stt{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Bitácoras de inspección</h1><div class="sub">Funcionan sin señal y guardan todo en este teléfono.</div></header>
<div class="apps">
  <a class="app" href="ups.html"><span class="ic">🔋</span><div><h3>UPS</h3><div class="muted" id="sUps">—</div></div></a>
  <a class="app" href="interruptores.html"><span class="ic">⚡</span><div><h3>Interruptores ETU45B</h3><div class="muted" id="sEtu">—</div></div></a>
</div>
<h2>Estado del teléfono</h2>
<div class="card"><div class="stt" id="stt"></div></div>
<p class="muted">Instálala con Chrome: menú ⋮ → "Agregar a pantalla principal" o "Instalar app". Descarga un respaldo en cada bitácora al terminar la ronda.</p>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const fd = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"2-digit"}); };
function info(key, arr){
  try{
    const o = JSON.parse(localStorage.getItem(key) || "{}"); const L = o[arr] || []; const lb = o.cfg && o.cfg.lastBackup;
    if (!L.length) return "Sin lecturas todavía";
    const ult = L.reduce((m,r)=>r.ts>m?r.ts:m, "");
    const dias = lb ? Math.floor((Date.now() - new Date(lb)) / 86400000) : null;
    return `${L.length} lecturas · última ${fd(ult)} · ` + (lb ? `respaldo hace ${dias} día(s)` : "sin respaldo") + (lb && dias < 7 ? "" : " ⚠");
  }catch{ return "No se pudo leer"; }
}
$("#sUps").textContent = info("bitacora-ups-standalone-v1", "lecturas");
$("#sEtu").textContent = info("bitacora-interruptores-v1", "lecturas");
const rows = [];
const add = (ok, t) => rows.push(`<span class="dot" style="background:${ok===null?"var(--muted)":ok?"var(--ok)":"var(--bad)"}"></span><span>${t}</span>`);
const render = () => { $("#stt").innerHTML = rows.join(""); };
(async () => {
  const pr = location.protocol;
  const fija = pr === "https:" || location.hostname === "localhost";
  add(fija, fija ? "Dirección fija: los datos no se pierden al cerrar Chrome." : "Abierta como archivo: usa la versión publicada.");
  if ("serviceWorker" in navigator && (pr === "https:" || location.hostname === "localhost")){
    try{
      await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
      add(true, "Lista para usarse sin señal.");
    }catch{ add(false, "No se pudo preparar el modo sin señal."); }
  } else add(false, "Modo sin señal no disponible en esta dirección.");
  try{
    const p = await navigator.storage?.persist?.();
    add(p ? true : null, p ? "Almacenamiento protegido: el sistema no lo borrará por falta de espacio." : "Almacenamiento no protegido todavía: instala la app en la pantalla principal para mejorarlo.");
  }catch{}
  const inst = matchMedia("(display-mode: standalone)").matches;
  add(inst ? true : null, inst ? "Abierta como app instalada." : "Abierta en el navegador. Instálala desde el menú ⋮ de Chrome.");
  render();
})();
})();
</script>
</body>
</html>
